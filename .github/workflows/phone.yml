# Builds the pulseSSS Phone iOS app on GitHub's Mac machines, publishes the unsigned .ipa as a release
# and updates the AltStore source (altstore/source.json), so AltStore offers the new version.
name: pulseSSS Phone

on:
  push:
    branches: [main]
    paths: ["ios/**", "altstore/make_source.py", ".github/workflows/phone.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phone-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -quiet \
            -project PulsePhone.xcodeproj -scheme PulsePhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PulsePhone.app Payload/
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/PulsePhone.app/Info.plist
          zip -qry pulseSSS-Phone.ipa Payload
          ls -l pulseSSS-Phone.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "phone-v$VERSION" ios/pulseSSS-Phone.ipa \
            --title "pulseSSS Phone $VERSION" --target "$GITHUB_SHA" \
            --notes "Unsigned build for AltStore / Sideloadly. Add the AltStore source from the README to get updates automatically."

      - name: Update AltStore source
        run: |
          python3 altstore/make_source.py --version "$VERSION" --build "$BUILD" \
            --ipa ios/pulseSSS-Phone.ipa --repo "$GITHUB_REPOSITORY" --tag "phone-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          git commit -m "AltStore source: pulseSSS Phone $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
