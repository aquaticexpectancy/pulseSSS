# XcodeGen spec for the pulseSSS Phone app. The GitHub workflow generates the Xcode project from this
# (there is no .xcodeproj in the repo) and builds an unsigned .ipa that AltStore / Sideloadly sign.
name: PulsePhone
options:
  bundleIdPrefix: com.forbandelse
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: NO
targets:
  PulsePhone:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: PulsePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forbandelse.pulsesss
        PRODUCT_NAME: PulsePhone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PulsePhone/Info.plist
        CODE_SIGNING_ALLOWED: NO
    info:
      path: PulsePhone/Info.plist
      properties:
        CFBundleDisplayName: pulseSSS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: pulseSSS connects to your Fitbit Air to read your heart rate and send it to your site and PC.
        CFBundleURLTypes:
          - CFBundleURLName: com.forbandelse.pulsesss.pair
            CFBundleURLSchemes: [pulsesss]
